<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F0E4">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Time Machine</title>
<style>
  :root { --ink:#2B1E14; --cream:#F6F0E4; --sand:#E4D9C6; --copper:#9C5B1F; --mute:#6B5A48; --ease:cubic-bezier(.2,.8,.2,1); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--sand); color: var(--ink); font-family: Inter, system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0 0 64px 0; display: flex; align-items: center; justify-content: center; }
  #device { position: relative; transform-origin: center center; padding: 12px; border-radius: 60px; background: var(--ink); box-shadow: 0 30px 80px rgba(43,30,20,.35); }
  #device.desk { padding: 0; border-radius: 12px; background: none; }
  #device.watch { padding: 14px; border-radius: 56px; }
  #viewport { position: relative; overflow: hidden; border-radius: 48px; background: var(--cream); }
  #device.desk #viewport { border-radius: 12px; }
  #device.watch #viewport { border-radius: 42px; background: #2B1E14; }
  .scr { position: absolute; inset: 0; background-repeat: no-repeat; will-change: transform, opacity; }
  .in-fwd   { animation: inFwd .32s var(--ease) both; }
  .out-fwd  { animation: outFwd .32s var(--ease) both; }
  .in-back  { animation: inBack .32s var(--ease) both; }
  .out-back { animation: outBack .32s var(--ease) both; }
  .in-fade  { animation: inFade .25s ease-out both; }
  @keyframes inFwd  { from { transform: translateX(100%); } to { transform: none; } }
  @keyframes outFwd { from { transform: none; } to { transform: translateX(-28%); filter: brightness(.92); } }
  @keyframes inBack { from { transform: translateX(-28%); filter: brightness(.92); } to { transform: none; filter: none; } }
  @keyframes outBack{ from { transform: none; } to { transform: translateX(100%); } }
  @keyframes inFade { from { opacity: 0; } to { opacity: 1; } }
  .hot { position: absolute; cursor: pointer; border-radius: 12px; transition: background-color .12s; }
  .hot:active { background: rgba(43,30,20,.12); }
  .flash .hot { background: rgba(156,91,31,.18); outline: 2px solid rgba(156,91,31,.55); }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  #bar button { font: inherit; font-size: 14px; border: 1px solid rgba(43,30,20,.2); background: rgba(255,251,243,.7); color: var(--ink); padding: 8px 16px; border-radius: 20px; cursor: pointer; }
  #bar button.on { background: var(--ink); color: var(--cream); border-color: var(--ink); }
  /* Phone: run full screen like the real app */
  @media (max-width: 520px) {
    html, body { background: var(--cream); }
    #stage { inset: 0; align-items: flex-start; }
    #device, #device.watch { padding: 0; border-radius: 0; box-shadow: none; background: none; transform-origin: top center; }
    #viewport { border-radius: 0; }
    #bar { display: none; }
  }
</style>
</head>
<body>
<div id="stage"><div id="device"><div id="viewport"></div></div></div>
<nav id="bar">
  <button data-flow="booking">App</button>
  <button data-flow="watch">Watch</button>
  <button data-flow="cms">CMS</button>
</nav>
<script>
const IMG = { phone: { src: 'phone.png', w: 4245 }, cms: { src: 'cms.png', w: 3451 }, watch: { src: 'watch.png', w: 1573 } };
const S = {
  '18:3':['phone',37,57,393,852],'18:78':['phone',510,57,393,852],'18:147':['phone',983,57,393,852],'18:223':['phone',1456,57,393,852,'pop'],
  '18:328':['phone',1929,57,393,852],'18:366':['phone',2402,57,393,852],'18:413':['phone',2875,57,393,852],'18:462':['phone',3348,57,393,852,'pop'],
  '20:225':['phone',37,1049,393,852],'20:293':['phone',510,1049,393,852],'20:455':['phone',983,1049,393,852],'20:488':['phone',1456,1049,393,852,'pop'],
  '20:536':['phone',1929,1049,393,852,'pop'],'20:575':['phone',2402,1049,393,852],
  '20:604':['watch',473,395,198,242],'20:738':['watch',731,395,198,242],'20:746':['watch',989,395,198,242],
  '23:565':['cms',53,104,1440,1024],'23:820':['cms',1573,104,1440,1024],
};
const L = [["18:3",16,173,290,250,0,"18:328"],["18:3",32,522,160,52,0,"18:78"],["18:3",16,606,361,52,0,"18:147"],["18:78",0,44,60,56,0,"BACK"],["18:147",0,44,60,56,0,"BACK"],["18:147",16,561,361,40,0,"18:223"],["18:147",16,776,361,52,0,"18:328"],["18:223",24,776,345,52,0,"18:147"],["18:328",0,44,60,56,0,"BACK"],["18:328",16,508,128,52,0,"18:462"],["18:328",130,747,133,17,0,"18:147"],["18:328",16,776,361,52,0,"20:225"],["18:366",16,349,361,64,0,"18:328"],["18:366",130,747,133,17,0,"18:147"],["18:413",16,349,361,64,0,"18:328"],["18:413",16,776,361,52,0,"18:147"],["18:462",345,70,40,40,0,"18:328"],["18:462",24,776,345,52,0,"18:328"],["20:225",0,44,60,56,0,"BACK"],["20:225",16,776,361,52,0,"20:293"],["20:293",16,100,361,354,0,"20:455"],["20:455",0,0,393,852,3000,"20:488"],["20:455",16,776,361,52,0,"20:575"],["20:488",24,712,345,52,0,"20:575"],["20:488",24,776,345,52,0,"20:536"],["20:536",16,776,361,52,0,"20:575"],["20:536",8,44,377,96,0,"20:455"],["20:575",16,776,361,52,0,"18:3"],["23:565",12,192,216,36,0,"23:820"],["23:820",12,72,216,36,0,"23:565"],["20:604",0,0,198,242,0,"20:738"],["20:738",0,0,198,242,0,"20:746"],["20:746",0,0,198,242,0,"20:604"]];
// Assist: let a suggestion card open Pick destination like in the app
L.push(["18:78",16,334,361,96,0,"18:147"]);
const FLOW = { booking: '18:3', cms: '23:565', watch: '20:604' };
const dev = document.getElementById('device'), vp = document.getElementById('viewport');
let cur = null, el = null, timer = null; const hist = [];
const mobile = () => innerWidth <= 520;
function fit() { if (!cur) return; const [kind, , , w, h] = S[cur]; const st = document.getElementById('stage');
  let k; if (mobile() && kind !== 'cms') k = Math.min(innerWidth / w, innerHeight / h); else { const pad = kind === 'cms' ? 0 : 28; k = Math.min((st.clientWidth - 40) / (w + pad), (st.clientHeight - 40) / (h + pad), 1); }
  dev.style.transform = `scale(${k})`; }
function build(id) { const [kind, x, y, w, h] = S[id]; const I = IMG[kind]; const d = document.createElement('div'); d.className = 'scr';
  Object.assign(d.style, { backgroundImage: `url(${I.src})`, backgroundSize: `${I.w}px auto`, backgroundPosition: `-${40 + x}px -${40 + y}px` });
  for (const [s, hx, hy, hw, hh, ms, dest] of L) { if (s !== id || ms) continue; const a = document.createElement('div'); a.className = 'hot';
    Object.assign(a.style, { left: hx + 'px', top: hy + 'px', width: hw + 'px', height: hh + 'px' });
    a.onclick = e => { e.stopPropagation(); dest === 'BACK' ? back() : go(dest); }; d.appendChild(a); }
  d.addEventListener('click', () => { d.classList.add('flash'); setTimeout(() => d.classList.remove('flash'), 450); });
  return d; }
function render(id, mode) {
  if (timer) { clearTimeout(timer); timer = null; }
  const [kind, , , w, h, type] = S[id];
  dev.className = kind === 'cms' ? 'desk' : kind === 'watch' ? 'watch' : '';
  vp.style.width = w + 'px'; vp.style.height = h + 'px';
  const old = el, next = build(id); vp.appendChild(next);
  const sameKind = cur && S[cur][0] === kind;
  if (old && sameKind && mode) {
    const pop = type === 'pop' || (cur && S[cur][5] === 'pop');
    if (pop) { next.classList.add('in-fade'); setTimeout(() => old.remove(), 260); }
    else if (mode === 'back') { vp.insertBefore(next, old); next.classList.add('in-back'); old.classList.add('out-back'); setTimeout(() => old.remove(), 330); }
    else { old.classList.add('out-fwd'); next.classList.add('in-fwd'); setTimeout(() => old.remove(), 330); }
  } else if (old) old.remove();
  el = next; cur = id;
  for (const [s, , , , , ms, dest] of L) if (s === id && ms) timer = setTimeout(() => cur === id && go(dest), ms);
  document.querySelectorAll('#bar button').forEach(b => b.classList.toggle('on', S[FLOW[b.dataset.flow]][0] === kind));
  fit(); }
function go(id) { hist.push(cur); render(id, 'fwd'); }
function back() { if (hist.length) render(hist.pop(), 'back'); }
document.querySelectorAll('#bar button').forEach(b => b.onclick = () => { hist.length = 0; render(FLOW[b.dataset.flow], null); });
// swipe from the left edge to go back, like iOS
let sx = null; addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX < 24 ? t.clientX : null; }, { passive: true });
addEventListener('touchend', e => { if (sx !== null && e.changedTouches[0].clientX - sx > 80) back(); sx = null; });
addEventListener('resize', fit);
render('18:3', null);
</script>
</body>
</html>
